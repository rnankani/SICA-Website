<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>SICA &mdash; References</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="officers.css?v=2">
</head>
<body data-page="references">
<div class="shell">
  <nav class="rail" id="rail"></nav>
  <main>
    <div class="topbar">
      <div>
        <div class="crumb">References</div>
        <h1 class="ptitle">Every doc, one place</h1>
        <p class="lede">Static reference material that lives outside the workspace. The other tabs hold live data; this one just answers &ldquo;where&rsquo;s the doc for X&rdquo; so links stop getting pasted into random meeting notes.</p>
      </div>
    </div>
    <div id="refs"></div>
  </main>
</div>

<script src="references-data.js?v=2"></script>
<script src="officers.js?v=2"></script>
<script>
window.sicaPageInit = function(){
  var EXT = '<svg class="ref-ic" viewBox="0 0 24 24" aria-hidden="true">' +
            '<path d="M14 4h6v6"/><path d="M20 4 11 13"/>' +
            '<path d="M18 14v5a1.8 1.8 0 0 1-1.8 1.8H5A1.8 1.8 0 0 1 3.2 19V7.8A1.8 1.8 0 0 1 5 6h5"/></svg>';
  var INT = '<svg class="ref-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>';

  document.getElementById('refs').innerHTML = window.SICA_REFERENCES.map(function(g){
    var rows = g.items.map(function(i){
      if (!i.url){
        return '<div class="ref-row is-empty"><span class="ref-t">' + i.title + '</span>' +
               '<span class="ref-hint">Link not added</span></div>';
      }
      var ext = !i.internal;
      return '<a class="ref-row" href="' + i.url + '"' +
             (ext ? ' target="_blank" rel="noopener noreferrer"' : '') + '>' +
             '<span class="ref-t">' + i.title + '</span>' +
             (ext ? EXT : INT) + '</a>';
    }).join('');
    return '<section class="ref-sec"><h2 class="sec-h">' + g.group + '</h2>' +
           '<div class="ref-list">' + rows + '</div></section>';
  }).join('');
};
</script>
</body>
</html>
