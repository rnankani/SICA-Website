<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>SICA &mdash; Applications</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="officers.css?v=15">
<meta name="view-transition" content="same-origin"><meta name="view-transition" content="same-origin"></head>
<body data-page="applications">
<div class="shell">
  <nav class="rail" id="rail"></nav>
  <main>
    <div class="topbar">
      <div>
        <div class="crumb">Intake</div>
        <h1 class="ptitle">Applications</h1>
        <p class="lede">Everyone who applied through the site. Submitted straight to the database &mdash; nothing goes through email.</p>
      </div>
    </div>

    <div id="appGuard"></div>
    <div id="appBody" hidden>
      <div class="mc-grid" id="appStats"></div>
      <div class="ptabs" id="appTabs"></div>
      <div class="panel"><div id="appList"></div></div>
    </div>
  </main>
</div>

<script src="references-data.js?v=14"></script>
<script src="role-expectations.js?v=15"></script>
<script src="supabase-config.js?v=14"></script>
<script src="auth.js?v=14"></script>
<script src="db.js?v=19"></script>
<script src="roles.js?v=14"></script>
<script src="tasks.js?v=14"></script>
<script src="officers.js?v=19"></script>
<script>
window.sicaPageInit = async function () {
  var DB = window.SICA_DB, R = window.SICA_ROLES, A = window.SICA_AUTH;
  var guard = document.getElementById('appGuard');
  var body  = document.getElementById('appBody');

  /* Applications carry other people's writing about their own weaknesses.
     Only the founder and president read them — the database enforces this
     too, but saying so here stops another officer wondering why the page
     is empty. */
  var role = R.active();
  if (role !== 'founder' && role !== 'president') {
    guard.innerHTML = '<div class="tbl-empty" style="padding:44px 20px">' +
      '<b>Founder and President only</b>' +
      '<p>Applications contain candid answers about people&rsquo;s own weaknesses, ' +
      'so they are not shared across the officer team.</p></div>';
    return;
  }
  body.hidden = false;

  /* Built from the shared definitions, plus the pre-merge values so a
     row submitted as a bare "secretary" still reads as one. */
  var RX = window.SICA_ROLE_EXPECTATIONS || {roles:{}, legacy:{}};
  var ROLE_LABEL = { other: 'Other', founder: 'Founder' };
  Object.keys(RX.roles || {}).forEach(function (k) { ROLE_LABEL[k] = RX.roles[k].label; });
  Object.keys(RX.legacy || {}).forEach(function (k) { ROLE_LABEL[k] = RX.legacy[k]; });
  var STATUS = {
    submitted: ['p-busy', 'New'],
    interview: ['p-idle', 'Interview'],
    approved:  ['p-ok',   'Approved'],
    rejected:  ['p-warn', 'Rejected'],
    archived:  ['p-idle', 'Archived']
  };
  var filter = 'submitted', rows = [], open = null, armed = null;
  var signedProfile = null;
  try { signedProfile = JSON.parse(localStorage.getItem('sica.profile') || 'null'); } catch (e) {}

  function ago(iso) {
    if (!iso) return '&mdash;';
    var d = Math.floor((Date.now() - new Date(iso)) / 86400000);
    if (d <= 0) {
      var h = Math.floor((Date.now() - new Date(iso)) / 3600000);
      return h < 1 ? 'just now' : h + (h === 1 ? ' hour ago' : ' hours ago');
    }
    return d === 1 ? 'yesterday' : d + ' days ago';
  }
  function esc(t) {
    return String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function para(t) {
    return t ? esc(t).replace(/\n+/g, '<br>') : '<span class="na">No answer</span>';
  }

  function card(a) {
    var st = STATUS[a.status] || STATUS.submitted;
    var isOpen = open === a.id;
    var receipt = a.id ? 'SICA-' + String(a.id).slice(0, 8).toUpperCase() : 'No receipt';
    var roleTxt = ROLE_LABEL[a.role_applied] || a.role_applied;
    if (a.role_applied === 'other' && a.role_other) roleTxt += ' — ' + esc(a.role_other);

    var head = '<button class="ap-head" data-act="open" data-id="' + a.id + '">' +
      '<span class="ap-who"><b>' + esc(a.name) + '</b>' +
        '<small>Grade ' + (a.grade || '—') + ' &middot; ' + esc(a.email) + ' &middot; ' + receipt + '</small></span>' +
      '<span class="ap-role">' + roleTxt + '</span>' +
      '<span class="pill ' + st[0] + '">' + st[1] + '</span>' +
      '<span class="ap-when">' + ago(a.created_at) + '</span>' +
      '<span class="ap-caret' + (isOpen ? ' on' : '') + '" aria-hidden="true"></span></button>';

    if (!isOpen) return '<div class="apcard" data-id="' + a.id + '">' + head + '</div>';

    var qa = [
      ['Built or led something nobody asked for', a.q_built],
      ['A specific weakness, and how it showed up recently', a.q_weakness],
      ['What SICA does that other clubs don’t', a.q_sica],
      ['What they’d contribute in the first month', a.q_first_month]
    ].map(function (q) {
      return '<div class="ap-q"><span>' + q[0] + '</span><p>' + para(q[1]) + '</p></div>';
    }).join('');

    var days = (a.lunch_days && a.lunch_days.length) ? a.lunch_days.join(', ') : null;
    var facts = [
      ['Free at lunch', days],
      ['After-school planning', a.after_school === null || a.after_school === undefined
        ? null : (a.after_school ? 'Yes' : 'No')],
      ['Other commitments', a.commitments],
      ['Links', a.links],
      ['Anything else', a.anything_else]
    ].filter(function (r) { return r[1]; }).map(function (r) {
      return '<div class="row2"><b>' + r[0] + '</b><span>' + para(r[1]) + '</span></div>';
    }).join('');

    var acts = '<div class="ap-acts">' +
      (a.status !== 'approved'  ? '<button class="ib ok"   data-act="approved"  data-id="' + a.id + '">Approve</button>' : '') +
      (a.status !== 'interview' ? '<button class="ib"      data-act="interview" data-id="' + a.id + '">Request interview</button>' : '') +
      (a.status !== 'rejected'  ? '<button class="ib warn" data-act="rejected"  data-id="' + a.id + '">Reject</button>' : '') +
      (a.status !== 'archived'  ? '<button class="ib"      data-act="archived"  data-id="' + a.id + '">Archive</button>' : '') +
      '<a class="ib" href="mailto:' + encodeURIComponent(a.email) + '">Email them</a>' +
      /* Two steps, because this one does not come back. The first click
         only arms the second, and anything else on the page disarms it
         again — a misfire here destroys somebody's written answers. */
      (armed === a.id
        ? '<button class="ib danger armed" data-act="delete-yes" data-id="' + a.id + '">Delete for good &mdash; click to confirm</button>' +
          '<button class="ib" data-act="delete-no" data-id="' + a.id + '">Keep it</button>'
        : '<button class="ib danger" data-act="delete" data-id="' + a.id + '">Delete</button>') +
      '</div>';

    return '<div class="apcard open" data-id="' + a.id + '">' + head +
      '<div class="ap-body">' + qa +
      (facts ? '<div class="rows ap-facts">' + facts + '</div>' : '') +
      acts + '</div></div>';
  }

  async function draw() {
    var listEl = document.getElementById('appList');
    try {
      rows = await DB.applications.list();
    } catch (e) {
      rows = [];
      document.getElementById('appStats').innerHTML = '';
      document.getElementById('appTabs').innerHTML = '';
      listEl.innerHTML = '<div class="tbl-empty"><b>Applications could not be loaded</b><p>' +
        'This is a database or access error—not an empty queue. Refresh, then sign out and back in if it continues.</p>' +
        '<button class="ib" data-act="retry">Try again</button></div>';
      return;
    }

    var shown = filter === 'all' ? rows : rows.filter(function (r) { return r.status === filter; });
    shown.sort(function (a, b) { return (b.created_at || '') > (a.created_at || '') ? 1 : -1; });

    listEl.innerHTML = shown.length
      ? shown.map(card).join('')
      : '<div class="tbl-empty"><b>' +
        (rows.length ? 'Nothing in this view' : 'Supabase returned zero applications') + '</b><p>' +
        (rows.length
          ? 'Try another tab.'
          : 'Signed in as <b>' + esc(signedProfile && signedProfile.email || 'unknown account') +
            '</b> with role <b>' + esc(signedProfile && signedProfile.role || role) +
            '</b>. This is a server result, not browser cache. If another device differs, run the application-access migration in Supabase.') +
        '</p></div>';

    var c = { submitted: 0, interview: 0, approved: 0, rejected: 0, archived: 0 };
    rows.forEach(function (r) { if (Object.prototype.hasOwnProperty.call(c, r.status)) c[r.status]++; });
    document.getElementById('appStats').innerHTML = [
      ['Waiting on you', c.submitted, c.submitted ? 'Unread' : 'Nothing new'],
      ['Interviews', c.interview, 'Requested'],
      ['Approved', c.approved, ''],
      ['Total received', rows.length, '']
    ].map(function (s, i) {
      return '<div class="stat' + (i === 0 && s[1] ? ' warn' : '') + '">' +
        '<span class="stat-k">' + s[0] + '</span><span class="stat-v">' + s[1] + '</span>' +
        '<span class="stat-s">' + s[2] + '</span></div>';
    }).join('');

    document.getElementById('appTabs').innerHTML =
      [['submitted', 'New', c.submitted], ['interview', 'Interview', c.interview],
       ['approved', 'Approved', c.approved], ['rejected', 'Rejected', c.rejected],
       ['archived', 'Archived', c.archived], ['all', 'All', rows.length]]
      .map(function (t) {
        return '<button class="ptab' + (filter === t[0] ? ' on' : '') + '" data-f="' + t[0] + '">' +
          t[1] + (t[2] ? ' <span class="tabn">' + t[2] + '</span>' : '') + '</button>';
      }).join('');
  }

  document.getElementById('appTabs').addEventListener('click', function (e) {
    var t = e.target.closest('.ptab'); if (!t) return;
    filter = t.dataset.f; open = null; armed = null; draw();
  });

  document.getElementById('appList').addEventListener('click', async function (e) {
    var b = e.target.closest('button'); if (!b) return;
    var id = b.dataset.id, act = b.dataset.act;

    if (act === 'retry') return draw();

    if (act === 'delete')     { armed = id;   return draw(); }
    if (act === 'delete-no')  { armed = null; return draw(); }
    if (act === 'delete-yes') {
      b.disabled = true; b.textContent = 'Deleting...';
      try {
        await DB.applications.remove(id);
      } catch (ex) {
        b.disabled = false;
        b.textContent = 'Could not delete: ' + (ex && ex.message ? ex.message : 'unknown error');
        return;
      }
      armed = null; open = null;
      return draw();
    }

    if (act === 'open') { open = open === id ? null : id; armed = null; return draw(); }
    if (['approved', 'interview', 'rejected', 'archived'].indexOf(act) < 0) return;
    armed = null;
    b.disabled = true;
    try { await DB.applications.setStatus(id, act); } catch (ex) {}
    await draw();
  });

  draw();
};
</script>
</body>
</html>
